// ============================================================
// 渲染逻辑 — 无需修改
// ============================================================
var currentCategory = "all";
var currentSearch = "";

function renderTabs() {
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = categories.map(function(c) {
    var cls = c.key === currentCategory ? "tab active" : "tab";
    return '<span class="' + cls + '" data-key="' + c.key + '">' + c.label + '</span>';
  }).join("");
}

function getVisibleSites() {
  return sites.filter(function(s) {
    if (currentCategory !== "all" && s.category !== currentCategory) return false;
    if (currentSearch) {
      var q = currentSearch.toLowerCase();
      return (s.name + s.desc + s.url).toLowerCase().indexOf(q) !== -1;
    }
    return true;
  });
}

function renderContent() {
  var visible = getVisibleSites();
  var content = document.getElementById("content");

  if (visible.length === 0) {
    content.innerHTML = '<div class="empty"><strong>没有匹配的结果</strong><p style="margin-top:8px">试试换个关键词或切换分类</p></div>';
    document.getElementById("stat").textContent = "共收录 " + sites.length + " 个网站，当前无匹配";
    return;
  }

  if (currentCategory === "all") {
    var order = categories.filter(function(c) { return c.key !== "all"; });
    var html = "";
    order.forEach(function(cat) {
      var items = visible.filter(function(s) { return s.category === cat.key; });
      if (items.length === 0) return;
      html += '<section class="category">';
      html += '<div class="category-header"><h2>' + cat.label + '</h2><span class="count">' + items.length + ' 个</span></div>';
      html += '<div class="grid">';
      items.forEach(function(s) { html += cardHtml(s); });
      html += '</div></section>';
    });
    content.innerHTML = html;
  } else {
    var html = '<div class="grid">';
    visible.forEach(function(s) { html += cardHtml(s); });
    html += '</div>';
    content.innerHTML = html;
  }

  document.getElementById("stat").textContent = "共收录 " + sites.length + " 个网站，当前显示 " + visible.length + " 个";
}

function cardHtml(s) {
  var host = s.url.replace(/^https?:\/\//, "").replace(/\/.*$/, "");
  return (
    '<a href="' + s.url + '" target="_blank" rel="noopener noreferrer" class="card">' +
    '<div class="card-name">' + esc(s.name) + '</div>' +
    '<div class="card-desc">' + esc(s.desc) + '</div>' +
    '<div class="card-domain">' + esc(host) + '</div>' +
    '</a>'
  );
}

function esc(str) {
  var d = document.createElement("div");
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

// Event bindings
document.getElementById("tabs").addEventListener("click", function(e) {
  if (e.target.classList.contains("tab")) {
    currentCategory = e.target.dataset.key;
    renderTabs();
    renderContent();
  }
});

var searchTimer;
document.getElementById("search").addEventListener("input", function(e) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function() {
    currentSearch = e.target.value.trim();
    renderContent();
  }, 200);
});

// Init
renderTabs();
renderContent();
</script>
